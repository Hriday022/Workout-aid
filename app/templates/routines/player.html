{% extends "base.html" %}
{% block title %}{{ day.name }} — Gym Tracker{% endblock %}

{% block content %}
<section class="player">
  <div class="player-header">
    <a href="{{ url_for('routines.list_routines') }}" class="link-muted back-link">← Splits</a>
    <h1>{{ day.name }}</h1>
    <div class="player-progress">
      <div class="player-progress-bar"><div class="player-progress-fill" id="progress-fill"></div></div>
      <span class="player-progress-label"><span id="progress-count">0</span> / {{ exercises|length }} done</span>
    </div>
  </div>

  <div class="player-stage" id="player-stage"></div>

  <ol class="player-checklist" id="player-checklist"></ol>

  <div class="player-actions-bottom">
    <button type="button" class="btn btn-ghost" id="end-early-btn">End session &amp; save progress</button>
  </div>
</section>

<div class="player-done-overlay" id="done-overlay" hidden>
  <div class="player-done-card">
    <span class="done-emoji">🎉</span>
    <h2>Workout complete!</h2>
    <p id="done-summary"></p>
    <div class="player-done-actions">
      <a href="{{ url_for('workouts.dashboard') }}" class="btn btn-primary">View log</a>
      <a href="{{ url_for('routines.list_routines') }}" class="btn btn-ghost">Back to splits</a>
    </div>
  </div>
</div>

<script id="exercises-data" type="application/json">{{ exercises | tojson }}</script>
<script>
  window.PLAYER_CONFIG = {
    finishUrl: {{ url_for('routines.finish_day', day_id=day.id) | tojson }},
    dayName: {{ day.name | tojson }}
  };
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/player.js') }}?v={{ config.get('ASSET_VERSION', 0) }}"></script>
{% endblock %}
