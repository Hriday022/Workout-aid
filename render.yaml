databases:
  - name: gym-tracker-db
    plan: free
    databaseName: gym_tracker
    user: gym_tracker

services:
  - type: web
    name: gym-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gym-tracker-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
